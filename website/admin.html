<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BK BOT Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--bg:#07070a;--bg2:#0d0d12;--bg3:#131319;--card:#0f0f15;--card2:#16161e;--border:rgba(255,255,255,0.05);--border2:rgba(255,255,255,0.08);--text:#e8e8f0;--text2:#9494a8;--text3:#6a6a7e;--primary:#ff6b6b;--green:#2ed573;--blue:#3498db;--purple:#9b59b6;--yellow:#f39c12;--red:#e74c3c;--orange:#ff9f43;--r:14px;--shadow:0 8px 32px rgba(0,0,0,0.4)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
        a{color:var(--primary);text-decoration:none}

        #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
        .login-box{background:var(--card);border:1px solid var(--border2);border-radius:20px;padding:48px 40px;width:100%;max-width:420px;text-align:center;box-shadow:var(--shadow)}
        .login-logo{width:64px;height:64px;margin:0 auto 20px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--orange));display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:#fff;filter:drop-shadow(0 4px 15px rgba(255,107,107,0.3))}
        .login-box h1{font-size:1.6rem;margin-bottom:12px;color:var(--text);font-weight:800}
        .login-secure{display:flex;align-items:center;justify-content:center;gap:6px;font-size:.78rem;color:var(--text2);margin-bottom:24px}
        .login-secure i{color:var(--green);font-size:.7rem}
        .login-box input{width:100%;padding:14px 18px;background:var(--bg2);border:2px solid var(--primary);border-radius:10px;color:var(--text);font-size:.9rem;outline:none;margin-bottom:16px;transition:all .2s;box-shadow:0 0 0 0 rgba(255,107,107,0)}
        .login-box input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,159,67,0.15)}
        .login-box input::placeholder{color:var(--text3)}
        .login-box button{width:100%;padding:14px;background:linear-gradient(135deg,var(--primary),var(--orange));border:none;border-radius:10px;color:#fff;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 4px 15px rgba(255,107,107,0.25)}
        .login-box button:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,107,107,0.35)}
        .login-box button:active{transform:translateY(0)}
        .login-error{color:var(--red);font-size:.8rem;margin-bottom:12px;display:none;background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.15);padding:8px 12px;border-radius:8px}
        .login-attempts{display:flex;align-items:center;justify-content:center;gap:6px;font-size:.72rem;color:var(--text3);margin-top:16px}
        .login-attempts i{color:var(--yellow);font-size:.65rem}

        #admin-app{display:none}
        .admin-header{position:sticky;top:0;z-index:100;background:rgba(7,7,10,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
        .admin-header .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1rem}
        .admin-header .logo img{width:28px;height:28px;border-radius:6px}
        .admin-header nav{display:flex;gap:4px}
        .admin-header nav button{padding:8px 16px;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--text2);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s}
        .admin-header nav button:hover{background:var(--bg3);color:var(--text)}
        .admin-header nav button.active{background:rgba(255,107,107,0.1);border-color:rgba(255,107,107,0.15);color:var(--primary)}
        .admin-header .logout{padding:8px 16px;background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.15);border-radius:8px;color:var(--red);font-size:.8rem;font-weight:600;cursor:pointer}

        .admin-content{max-width:1400px;margin:0 auto;padding:28px}
        .page{display:none}.page.active{display:block}

        .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:28px}
        .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;position:relative;overflow:hidden}
        .stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
        .stat-card.red::before{background:linear-gradient(90deg,var(--primary),transparent)}
        .stat-card.green::before{background:linear-gradient(90deg,var(--green),transparent)}
        .stat-card.blue::before{background:linear-gradient(90deg,var(--blue),transparent)}
        .stat-card.purple::before{background:linear-gradient(90deg,var(--purple),transparent)}
        .stat-card.yellow::before{background:linear-gradient(90deg,var(--yellow),transparent)}
        .stat-card .label{font-size:.72rem;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
        .stat-card .value{font-size:1.8rem;font-weight:800}
        .stat-card .sub{font-size:.72rem;color:var(--text2);margin-top:4px}

        .section-title{font-size:1.1rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
        .section-title i{color:var(--primary);font-size:.9rem}

        .servers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:28px}
        .server-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;cursor:pointer;transition:all .3s}
        .server-card:hover{border-color:rgba(255,107,107,0.2);transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,0.3)}
        .server-card .head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
        .server-card .icon{width:48px;height:48px;border-radius:14px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:800;color:var(--primary);overflow:hidden;flex-shrink:0}
        .server-card .icon img{width:100%;height:100%;object-fit:cover}
        .server-card .info{flex:1;min-width:0}
        .server-card .name{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .server-card .id{font-size:.7rem;color:var(--text3);font-family:monospace}
        .server-card .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        .server-card .metric{font-size:.75rem;color:var(--text2);display:flex;align-items:center;gap:6px}
        .server-card .metric i{font-size:.65rem;width:14px;text-align:center}
        .server-card .sec-row{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
        .sec-badge{font-size:.65rem;padding:3px 8px;border-radius:6px;font-weight:600;display:flex;align-items:center;gap:4px}
        .sec-badge.on{background:rgba(46,213,115,0.1);color:var(--green);border:1px solid rgba(46,213,115,0.15)}
        .sec-badge.off{background:rgba(231,76,60,0.1);color:var(--red);border:1px solid rgba(231,76,60,0.15)}
        .sec-badge i{font-size:.55rem}

        .detail-header{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border)}
        .detail-icon{width:64px;height:64px;border-radius:18px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:800;color:var(--primary);overflow:hidden;flex-shrink:0}
        .detail-icon img{width:100%;height:100%;object-fit:cover}
        .detail-info h2{font-size:1.3rem;font-weight:800}
        .detail-info p{font-size:.8rem;color:var(--text2)}
        .back-btn{margin-left:auto;padding:8px 16px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--text2);font-size:.8rem;cursor:pointer;font-weight:600}
        .back-btn:hover{color:var(--text);border-color:var(--border)}

        .tabs{display:flex;gap:4px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px}
        .tabs button{padding:8px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s}
        .tabs button:hover{color:var(--text)}
        .tabs button.active{background:rgba(255,107,107,0.1);border-color:rgba(255,107,107,0.15);color:var(--primary)}
        .tab-content{display:none}.tab-content.active{display:block}

        .table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
        table{width:100%;border-collapse:collapse}
        th{background:var(--bg3);padding:12px 16px;text-align:left;font-size:.72rem;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600;border-bottom:1px solid var(--border)}
        td{padding:10px 16px;font-size:.82rem;border-bottom:1px solid var(--border);color:var(--text2)}
        tr:hover td{background:rgba(255,255,255,0.01)}
        td .avatar{width:28px;height:28px;border-radius:50%;vertical-align:middle;margin-right:8px}
        td .tag{font-weight:600;color:var(--text)}
        td .bot-tag{font-size:.6rem;background:var(--primary);color:#fff;padding:1px 5px;border-radius:3px;margin-left:6px;font-weight:700}
        td .role{display:inline-block;font-size:.65rem;padding:2px 7px;border-radius:5px;margin:1px;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text3)}

        .search-bar{display:flex;gap:8px;margin-bottom:16px}
        .search-bar input{flex:1;padding:10px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.85rem;outline:none}
        .search-bar input:focus{border-color:var(--primary)}
        .search-bar button{padding:10px 20px;background:var(--primary);border:none;border-radius:8px;color:#fff;font-size:.85rem;font-weight:600;cursor:pointer}

        .action-btn{padding:5px 12px;border-radius:6px;border:1px solid;font-size:.72rem;font-weight:600;cursor:pointer;transition:all .15s;background:transparent}
        .action-btn.danger{color:var(--red);border-color:rgba(231,76,60,0.2)}.action-btn.danger:hover{background:rgba(231,76,60,0.1)}
        .action-btn.warn{color:var(--yellow);border-color:rgba(243,156,18,0.2)}.action-btn.warn:hover{background:rgba(243,156,18,0.1)}
        .action-btn.info{color:var(--blue);border-color:rgba(52,152,219,0.2)}.action-btn.info:hover{background:rgba(52,152,219,0.1)}
        .action-btn.success{color:var(--green);border-color:rgba(46,213,115,0.2)}.action-btn.success:hover{background:rgba(46,213,115,0.1)}

        .setting-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
        .setting-item{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
        .setting-item .key{font-size:.8rem;color:var(--text2);font-weight:500}
        .setting-item .val{font-size:.82rem;font-weight:700;color:var(--text);max-width:180px;text-align:right;word-break:break-all}
        .setting-item .val.on{color:var(--green)}.setting-item .val.off{color:var(--red)}

        .activity-item{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);font-size:.8rem}
        .activity-item:last-child{border-bottom:none}
        .activity-item .time{color:var(--text3);font-size:.7rem;white-space:nowrap;min-width:60px}
        .activity-item .msg{color:var(--text2);flex:1}
        .activity-item .msg strong{color:var(--text)}

        .empty{text-align:center;padding:48px;color:var(--text3);font-size:.85rem}
        .empty i{font-size:2rem;margin-bottom:12px;display:block;opacity:.3}

        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:none;align-items:center;justify-content:center}
        .modal-overlay.show{display:flex}
        .modal{background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:28px;width:100%;max-width:420px;box-shadow:var(--shadow)}
        .modal h3{font-size:1rem;margin-bottom:16px}
        .modal input,.modal textarea,.modal select{width:100%;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.85rem;outline:none;margin-bottom:12px;font-family:inherit}
        .modal textarea{min-height:80px;resize:vertical}
        .modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
        .modal .btns button{padding:8px 18px;border-radius:8px;border:none;font-size:.82rem;font-weight:600;cursor:pointer}
        .modal .btn-cancel{background:var(--bg3);color:var(--text2)}.modal .btn-confirm{background:var(--primary);color:#fff}

        .toast{position:fixed;bottom:24px;right:24px;z-index:300;padding:12px 20px;border-radius:10px;font-size:.82rem;font-weight:600;transform:translateY(80px);opacity:0;transition:all .3s;pointer-events:none}
        .toast.show{transform:translateY(0);opacity:1}
        .toast.success{background:rgba(46,213,115,0.15);border:1px solid rgba(46,213,115,0.2);color:var(--green)}
        .toast.error{background:rgba(231,76,60,0.15);border:1px solid rgba(231,76,60,0.2);color:var(--red)}

        @media(max-width:768px){
            .admin-header{flex-wrap:wrap;gap:8px;padding:10px 16px}
            .admin-header nav{order:3;width:100%;overflow-x:auto}
            .admin-content{padding:16px}
            .stats-grid{grid-template-columns:1fr 1fr}
            .servers-grid{grid-template-columns:1fr}
            .tabs{flex-wrap:nowrap}
            .setting-grid{grid-template-columns:1fr}
        }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <div class="login-logo"><i class="fas fa-shield-halved"></i></div>
        <h1>Admin Panel</h1>
        <div class="login-secure"><i class="fas fa-shield-halved"></i> Secured with rate limiting & CSRF protection</div>
        <div class="login-error" id="login-error"></div>
        <input type="password" id="login-pw" placeholder="Enter admin password" autofocus>
        <button onclick="doLogin()">Login</button>
        <div class="login-attempts"><i class="fas fa-info-circle"></i> Maximum 5 login attempts per 15 minutes</div>
    </div>
</div>

<div id="admin-app">
    <header class="admin-header">
        <div class="logo">
            <img src="https://cdn.discordapp.com/icons/1523800606488396049/b733ff3bc01081cee7ff0a95a4a313a1.png?size=64" alt="">
            <span>BK BOT Admin</span>
        </div>
        <nav id="nav">
            <button class="active" data-page="overview">Overview</button>
            <button data-page="servers">Servers</button>
            <button data-page="activity">Activity</button>
            <button data-page="honeypot">Honeypot</button>
            <button data-page="audit">Audit Log</button>
        </nav>
        <button class="logout" onclick="doLogout()">Logout</button>
    </header>

    <div class="admin-content">
        <!-- OVERVIEW -->
        <div class="page active" id="page-overview">
            <div class="stats-grid" id="stats-grid"></div>
            <div class="section-title"><i class="fas fa-clock"></i> Recent Activity</div>
            <div class="table-wrap"><div id="overview-activity"></div></div>
        </div>

        <!-- SERVERS -->
        <div class="page" id="page-servers">
            <div class="section-title"><i class="fas fa-server"></i> All Servers <span id="server-count" style="color:var(--text3);font-weight:400;font-size:.85rem"></span></div>
            <div class="servers-grid" id="servers-grid"></div>
        </div>

        <!-- SERVER DETAIL -->
        <div class="page" id="page-server-detail">
            <div class="detail-header" id="detail-header"></div>
            <div class="tabs" id="detail-tabs">
                <button class="active" data-tab="overview">Overview</button>
                <button data-tab="members">Members</button>
                <button data-tab="warnings">Warnings</button>
                <button data-tab="settings">Settings</button>
                <button data-tab="commands">Commands</button>
                <button data-tab="backups">Backups</button>
            </div>
            <div class="tab-content active" id="tab-overview"></div>
            <div class="tab-content" id="tab-members"></div>
            <div class="tab-content" id="tab-warnings"></div>
            <div class="tab-content" id="tab-settings"></div>
            <div class="tab-content" id="tab-commands"></div>
            <div class="tab-content" id="tab-backups"></div>
        </div>

        <!-- ACTIVITY -->
        <div class="page" id="page-activity">
            <div class="section-title"><i class="fas fa-stream"></i> Activity Feed</div>
            <div class="table-wrap"><div id="activity-log"></div></div>
        </div>

        <!-- HONEYPOT -->
        <div class="page" id="page-honeypot">
            <div class="section-title"><i class="fas fa-spider"></i> Honeypot Violations</div>
            <div class="table-wrap"><div id="honeypot-log"></div></div>
        </div>

        <!-- AUDIT LOG -->
        <div class="page" id="page-audit">
            <div class="section-title"><i class="fas fa-clipboard-list"></i> Admin Audit Log</div>
            <div class="table-wrap"><div id="audit-log"></div></div>
        </div>
    </div>
</div>

<!-- Action Modal -->
<div class="modal-overlay" id="modal">
    <div class="modal">
        <h3 id="modal-title">Action</h3>
        <div id="modal-body"></div>
        <div class="btns">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-confirm" id="modal-confirm">Confirm</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';
let currentServer = null;

// ====== AUTH ======
async function checkAuth() {
    const r = await fetch(`${API}/admin/api/check`, { credentials: 'include' });
    const d = await r.json();
    if (d.logged_in) { document.getElementById('login-screen').style.display = 'none'; document.getElementById('admin-app').style.display = 'block'; loadOverview(); }
}

document.getElementById('login-pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
    const pw = document.getElementById('login-pw').value;
    const errEl = document.getElementById('login-error');
    if (!pw) { errEl.textContent = 'Please enter a password'; errEl.style.display = 'block'; return; }
    try {
        const r = await fetch(`${API}/admin/api/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ password: pw }) });
        const d = await r.json();
        if (r.ok) { document.getElementById('login-screen').style.display = 'none'; document.getElementById('admin-app').style.display = 'block'; loadOverview(); }
        else if (r.status === 429) { errEl.textContent = d.error || 'Too many attempts. Locked out.'; errEl.style.display = 'block'; }
        else { errEl.textContent = d.error || 'Wrong password' + (d.attemptsLeft !== undefined ? ` (${d.attemptsLeft} attempts left)` : ''); errEl.style.display = 'block'; }
        document.getElementById('login-pw').value = '';
    } catch { errEl.textContent = 'Connection error'; errEl.style.display = 'block'; }
}

async function doLogout() {
    await fetch(`${API}/admin/api/logout`, { method: 'POST', credentials: 'include' });
    document.getElementById('admin-app').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('login-pw').value = '';
}

// ====== NAV ======
document.getElementById('nav').addEventListener('click', e => {
    const btn = e.target.closest('button[data-page]');
    if (!btn) return;
    document.querySelectorAll('#nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const page = btn.dataset.page;
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(`page-${page}`).classList.add('active');
    if (page === 'servers') loadServers();
    else if (page === 'activity') loadActivity();
    else if (page === 'honeypot') loadHoneypot();
    else if (page === 'audit') loadAudit();
});

// ====== HELPERS ======
function fmt(n) { if (n >= 1e6) return (n/1e6).toFixed(1) + 'M'; if (n >= 1e3) return (n/1e3).toFixed(1) + 'K'; return String(n); }
function avatarURL(user) { return user?.avatar ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=64` : `https://cdn.discordapp.com/embed/avatars/${parseInt(user?.id || '0') >> 22n % 6}.png`; }
function guildIcon(g) { return g?.icon ? `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png?size=128` : ''; }
function timeAgo(d) { if (!d) return ''; const s = Math.floor((Date.now() - new Date(d)) / 1000); if (s < 60) return s + 's ago'; if (s < 3600) return Math.floor(s/60) + 'm ago'; if (s < 86400) return Math.floor(s/3600) + 'h ago'; return Math.floor(s/86400) + 'd ago'; }
function toast(msg, type='success') { const t = document.getElementById('toast'); t.textContent = msg; t.className = `toast ${type} show`; setTimeout(() => t.classList.remove('show'), 3000); }

function getCsrfToken() { const m = document.cookie.match(/bk_csrf=([^;]+)/); return m ? m[1] : ''; }

async function apiFetch(path, opts={}) {
    const headers = { ...(opts.headers || {}) };
    if (opts.method && opts.method !== 'GET') {
        headers['X-CSRF-Token'] = getCsrfToken();
    }
    const r = await fetch(`${API}${path}`, { credentials: 'include', ...opts, headers });
    if (r.status === 401) { doLogout(); throw new Error('Session expired'); }
    if (r.status === 403) { const d = await r.json(); throw new Error(d.error || 'Forbidden'); }
    if (r.status === 429) { const d = await r.json(); throw new Error(d.error || 'Rate limited'); }
    return r.json();
}

// ====== OVERVIEW ======
async function loadOverview() {
    try {
        const d = await apiFetch('/admin/api/overview');
        const s = d.stats;
        document.getElementById('stats-grid').innerHTML = `
            <div class="stat-card red"><div class="label">Servers</div><div class="value">${fmt(s.servers)}</div></div>
            <div class="stat-card green"><div class="label">Total Members</div><div class="value">${fmt(s.totalMembers)}</div></div>
            <div class="stat-card blue"><div class="label">Commands Run</div><div class="value">${fmt(s.commandsRun)}</div></div>
            <div class="stat-card purple"><div class="label">Messages Seen</div><div class="value">${fmt(s.messagesSeen)}</div></div>
            <div class="stat-card yellow"><div class="label">Warnings</div><div class="value">${fmt(s.warningsIssued)}</div></div>
            <div class="stat-card red"><div class="label">Bans</div><div class="value">${fmt(s.bans)}</div></div>
            <div class="stat-card green"><div class="label">Kicks</div><div class="value">${fmt(s.kicks)}</div></div>
            <div class="stat-card blue"><div class="label">Mutes</div><div class="value">${fmt(s.mutes)}</div></div>
        `;
        renderActivity(d.recentActivity, 'overview-activity');
    } catch(e) { console.error(e); }
}

// ====== SERVERS ======
async function loadServers() {
    const grid = document.getElementById('servers-grid');
    grid.innerHTML = '<div class="empty"><i class="fas fa-spinner fa-spin"></i> Loading servers...</div>';
    try {
        const servers = await apiFetch('/admin/api/servers');
        document.getElementById('server-count').textContent = `(${servers.length})`;
        if (!servers.length) { grid.innerHTML = '<div class="empty"><i class="fas fa-server"></i> No servers found</div>'; return; }
        grid.innerHTML = servers.map(s => `
            <div class="server-card" onclick="openServer('${s.id}')">
                <div class="head">
                    <div class="icon">${s.icon ? `<img src="${guildIcon(s)}" alt="">` : (s.name||'?')[0]}</div>
                    <div class="info"><div class="name">${esc(s.name)}</div><div class="id">${s.id}</div></div>
                </div>
                <div class="metrics">
                    <div class="metric"><i class="fas fa-users" style="color:var(--blue)"></i> ${fmt(s.members)} members</div>
                    <div class="metric"><i class="fas fa-circle" style="color:var(--green);font-size:.5rem"></i> ${fmt(s.online)} online</div>
                    <div class="metric"><i class="fas fa-hashtag" style="color:var(--purple)"></i> ${s.channels} channels</div>
                    <div class="metric"><i class="fas fa-trophy" style="color:var(--yellow)"></i> ${s.boosts} boosts</div>
                </div>
                <div class="sec-row">
                    <span class="sec-badge ${s.security?.antiNuke?'on':'off'}"><i class="fas fa-${s.security?.antiNuke?'check':'times'}"></i> Nuke</span>
                    <span class="sec-badge ${s.security?.antiRaid?'on':'off'}"><i class="fas fa-${s.security?.antiRaid?'check':'times'}"></i> Raid</span>
                    <span class="sec-badge ${s.security?.antiSpam?'on':'off'}"><i class="fas fa-${s.security?.antiSpam?'check':'times'}"></i> Spam</span>
                    <span class="sec-badge ${s.security?.antiLink?'on':'off'}"><i class="fas fa-${s.security?.antiLink?'check':'times'}"></i> Link</span>
                    ${s.warnings ? `<span class="sec-badge off"><i class="fas fa-exclamation-triangle"></i> ${s.warnings} warns</span>` : ''}
                </div>
            </div>
        `).join('');
    } catch(e) { grid.innerHTML = '<div class="empty"><i class="fas fa-exclamation-circle"></i> Error loading servers</div>'; }
}

// ====== SERVER DETAIL ======
async function openServer(id) {
    currentServer = id;
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-server-detail').classList.add('active');
    document.querySelectorAll('#nav button').forEach(b => b.classList.remove('active'));

    const header = document.getElementById('detail-header');
    header.innerHTML = '<div class="empty"><i class="fas fa-spinner fa-spin"></i> Loading server...</div>';

    try {
        const d = await apiFetch(`/admin/api/server/${id}`);
        const g = d.guild;
        header.innerHTML = `
            <div class="detail-icon">${g.icon ? `<img src="${guildIcon(g)}" alt="">` : (g.name||'?')[0]}</div>
            <div class="detail-info"><h2>${esc(g.name)}</h2><p>${fmt(g.approximate_member_count)} members &middot; ${d.channels.length} channels &middot; ${d.roles.length} roles &middot; ID: ${g.id}</p></div>
            <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> Back</button>
        `;

        // Overview tab
        document.getElementById('tab-overview').innerHTML = `
            <div class="stats-grid">
                <div class="stat-card green"><div class="label">Members</div><div class="value">${fmt(g.approximate_member_count)}</div></div>
                <div class="stat-card blue"><div class="label">Online</div><div class="value">${fmt(g.approximate_presence_count)}</div></div>
                <div class="stat-card purple"><div class="label">Channels</div><div class="value">${d.channels.length}</div></div>
                <div class="stat-card yellow"><div class="label">Roles</div><div class="value">${d.roles.length}</div></div>
                <div class="stat-card red"><div class="label">Warnings</div><div class="value">${d.warnings.length}</div></div>
                <div class="stat-card green"><div class="label">Backups</div><div class="value">${d.backups.length}</div></div>
            </div>
            <div class="section-title"><i class="fas fa-shield-halved"></i> Security Status</div>
            <div class="setting-grid" style="margin-bottom:20px">
                <div class="setting-item"><span class="key">Anti-Nuke</span><span class="val ${d.settings.anti_nuke!==false?'on':'off'}">${d.settings.anti_nuke!==false?'ON':'OFF'}</span></div>
                <div class="setting-item"><span class="key">Anti-Raid</span><span class="val ${d.settings.anti_raid!==false?'on':'off'}">${d.settings.anti_raid!==false?'ON':'OFF'}</span></div>
                <div class="setting-item"><span class="key">Anti-Spam</span><span class="val ${d.settings.anti_spam!==false?'on':'off'}">${d.settings.anti_spam!==false?'ON':'OFF'}</span></div>
                <div class="setting-item"><span class="key">Anti-Link</span><span class="val ${d.settings.anti_link!==false?'on':'off'}">${d.settings.anti_link!==false?'ON':'OFF'}</span></div>
                <div class="setting-item"><span class="key">Auto Mod</span><span class="val ${d.settings.auto_mod_enabled?'on':'off'}">${d.settings.auto_mod_enabled?'ON':'OFF'}</span></div>
                <div class="setting-item"><span class="key">Leveling</span><span class="val ${d.settings.level_enabled?'on':'off'}">${d.settings.level_enabled?'ON':'OFF'}</span></div>
            </div>
            <div class="section-title"><i class="fas fa-list"></i> Channels</div>
            <div class="table-wrap" style="max-height:300px;overflow-y:auto"><table><thead><tr><th>Type</th><th>Name</th><th>ID</th></tr></thead><tbody>
                ${d.channels.map(c => `<tr><td><i class="fas fa-${c.type===0?'hashtag':c.type===2?'volume-high':c.type===4?'folder':'comment'}" style="color:var(--text3);width:16px"></i></td><td style="color:var(--text)">${esc(c.name)}</td><td style="font-family:monospace;font-size:.72rem;color:var(--text3)">${c.id}</td></tr>`).join('')}
            </tbody></table></div>
        `;

        // Members tab
        document.getElementById('tab-members').innerHTML = `
            <div class="search-bar">
                <input id="member-search" placeholder="Search by username or ID..." onkeydown="if(event.key==='Enter')searchMembers()">
                <button onclick="searchMembers()"><i class="fas fa-search"></i> Search</button>
            </div>
            <div class="table-wrap" id="members-table"><div class="empty"><i class="fas fa-search"></i> Search for a member</div></div>
        `;

        // Warnings tab
        renderWarnings(d.warnings);

        // Settings tab
        document.getElementById('tab-settings').innerHTML = `
            <div class="setting-grid">
                ${Object.entries(d.settings).map(([k,v]) => `
                    <div class="setting-item">
                        <span class="key">${k.replace(/_/g,' ')}</span>
                        <span class="val ${v===true?'on':v===false?'off':''}">${typeof v==='boolean'?(v?'ON':'OFF'):Array.isArray(v)?v.join(', '):v||'—'}</span>
                    </div>
                `).join('')}
            </div>
        `;

        // Commands tab
        document.getElementById('tab-commands').innerHTML = d.commands.length ? `
            <div class="table-wrap"><table><thead><tr><th>Name</th><th>Response</th><th>Status</th></tr></thead><tbody>
                ${d.commands.map(c => `<tr><td style="color:var(--text);font-weight:600">${esc(c.name)}</td><td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.response)}</td><td><span class="sec-badge ${c.enabled!==false?'on':'off'}">${c.enabled!==false?'Enabled':'Disabled'}</span></td></tr>`).join('')}
            </tbody></table></div>
        ` : '<div class="empty"><i class="fas fa-terminal"></i> No custom commands</div>';

        // Backups tab
        document.getElementById('tab-backups').innerHTML = d.backups.length ? `
            <div class="table-wrap"><table><thead><tr><th>ID</th><th>Created</th><th>Size</th></tr></thead><tbody>
                ${d.backups.map(b => `<tr><td style="font-family:monospace;font-size:.75rem;color:var(--text)">${esc(b.id?.slice(-12) || '—')}</td><td>${timeAgo(b.created)}</td><td>${b.channels?.length||0} ch, ${b.roles?.length||0} roles</td></tr>`).join('')}
            </tbody></table></div>
        ` : '<div class="empty"><i class="fas fa-cloud"></i> No backups yet</div>';

        // Tab switching
        document.getElementById('detail-tabs').onclick = e => {
            const btn = e.target.closest('button[data-tab]');
            if (!btn) return;
            document.querySelectorAll('#detail-tabs button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
        };

    } catch(e) { header.innerHTML = `<div class="empty"><i class="fas fa-exclamation-circle"></i> Error: ${e.message}</div>`; }
}

function goBack() {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-servers').classList.add('active');
    document.querySelectorAll('#nav button').forEach(b => b.classList.remove('active'));
    document.querySelector('[data-page="servers"]').classList.add('active');
    loadServers();
}

// ====== MEMBERS ======
async function searchMembers() {
    const q = document.getElementById('member-search').value.trim();
    const table = document.getElementById('members-table');
    table.innerHTML = '<div class="empty"><i class="fas fa-spinner fa-spin"></i> Searching...</div>';
    try {
        const members = await apiFetch(`/admin/api/server/${currentServer}/members?search=${encodeURIComponent(q)}`);
        if (!members.length) { table.innerHTML = '<div class="empty"><i class="fas fa-users"></i> No members found</div>'; return; }
        table.innerHTML = `<table><thead><tr><th>User</th><th>Joined</th><th>Roles</th><th>Actions</th></tr></thead><tbody>
            ${members.map(m => `<tr>
                <td><img class="avatar" src="${avatarURL(m)}" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'"><span class="tag">${esc(m.username)}</span>${m.bot?'<span class="bot-tag">BOT</span>':''}<br><span style="font-size:.7rem;color:var(--text3)">${m.id}</span></td>
                <td style="font-size:.75rem">${timeAgo(m.joined)}</td>
                <td>${(m.roles||[]).slice(0,3).map(r=>`<span class="role">${r}</span>`).join('')}${m.roles?.length>3?`<span class="role">+${m.roles.length-3}</span>`:''}</td>
                <td><button class="action-btn warn" onclick="doAction('warn','${m.id}','${esc(m.username)}')">Warn</button> <button class="action-btn info" onclick="doAction('kick','${m.id}','${esc(m.username)}')">Kick</button> <button class="action-btn danger" onclick="doAction('ban','${m.id}','${esc(m.username)}')">Ban</button></td>
            </tr>`).join('')}
        </tbody></table>`;
    } catch(e) { table.innerHTML = '<div class="empty"><i class="fas fa-exclamation-circle"></i> Error loading members</div>'; }
}

// ====== WARNINGS ======
function renderWarnings(warnings) {
    const el = document.getElementById('tab-warnings');
    if (!warnings.length) { el.innerHTML = '<div class="empty"><i class="fas fa-check-circle"></i> No warnings</div>'; return; }
    el.innerHTML = `<div class="table-wrap"><table><thead><tr><th>User</th><th>Reason</th><th>Moderator</th><th>Date</th><th>Action</th></tr></thead><tbody>
        ${warnings.map((w,i) => `<tr>
            <td style="font-family:monospace;font-size:.75rem;color:var(--text)">${w.userId}</td>
            <td>${esc(w.reason)}</td>
            <td style="color:var(--text2)">${esc(w.moderator)}</td>
            <td style="font-size:.75rem;color:var(--text3)">${timeAgo(w.date)}</td>
            <td><button class="action-btn danger" onclick="deleteWarning('${w.userId}',${i})"><i class="fas fa-trash"></i></button></td>
        </tr>`).join('')}
    </tbody></table></div>`;
}

async function deleteWarning(userId, index) {
    if (!confirm('Delete this warning?')) return;
    try {
        await apiFetch(`/admin/api/server/${currentServer}/action`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'deleteWarn', userId, index }) });
        toast('Warning deleted');
        const d = await apiFetch(`/admin/api/server/${currentServer}`);
        renderWarnings(d.warnings);
    } catch(e) { toast('Error: ' + e.message, 'error'); }
}

// ====== ACTIONS ======
function doAction(action, userId, username) {
    const modal = document.getElementById('modal');
    const title = document.getElementById('modal-title');
    const body = document.getElementById('modal-body');
    const confirm = document.getElementById('modal-confirm');

    title.textContent = `${action.charAt(0).toUpperCase() + action.slice(1)} ${username}`;
    body.innerHTML = `<input id="action-reason" placeholder="Reason (optional)"><p style="font-size:.75rem;color:var(--text3)">This action will be performed immediately.</p>`;
    modal.classList.add('show');

    confirm.onclick = async () => {
        const reason = document.getElementById('action-reason').value;
        try {
            await apiFetch(`/admin/api/server/${currentServer}/action`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, userId, reason }) });
            toast(`${action} executed on ${username}`);
            closeModal();
        } catch(e) { toast('Error: ' + e.message, 'error'); }
    };
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

// ====== ACTIVITY ======
async function loadActivity() {
    const el = document.getElementById('activity-log');
    el.innerHTML = '<div class="empty"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';
    try {
        const data = await apiFetch('/admin/api/activity');
        renderActivity(data, 'activity-log');
    } catch(e) { el.innerHTML = '<div class="empty"><i class="fas fa-exclamation-circle"></i> Error</div>'; }
}

function renderActivity(data, containerId) {
    const el = document.getElementById(containerId);
    if (!data?.length) { el.innerHTML = '<div class="empty"><i class="fas fa-stream"></i> No activity</div>'; return; }
    el.innerHTML = data.map(a => `
        <div class="activity-item">
            <span class="time">${timeAgo(a.date || a.time)}</span>
            <span class="msg">${esc(a.message || a.action || JSON.stringify(a))}</span>
        </div>
    `).join('');
}

// ====== HONEYPOT ======
async function loadHoneypot() {
    const el = document.getElementById('honeypot-log');
    el.innerHTML = '<div class="empty"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';
    try {
        const data = await apiFetch('/admin/api/honeypot');
        if (!data.length) { el.innerHTML = '<div class="empty"><i class="fas fa-spider"></i> No honeypot violations</div>'; return; }
        el.innerHTML = data.map(h => `
            <div class="activity-item">
                <span class="time">${timeAgo(h.date)}</span>
                <span class="msg"><strong>${esc(h.user || h.userId)}</strong> triggered honeypot in <strong>${esc(h.guild || h.guildId)}</strong>: ${esc(h.command || h.reason || '')}</span>
            </div>
        `).join('');
    } catch(e) { el.innerHTML = '<div class="empty"><i class="fas fa-exclamation-circle"></i> Error</div>'; }
}

// ====== AUDIT ======
async function loadAudit() {
    const el = document.getElementById('audit-log');
    el.innerHTML = '<div class="empty"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';
    try {
        const data = await apiFetch('/admin/api/audit');
        if (!data.length) { el.innerHTML = '<div class="empty"><i class="fas fa-clipboard-list"></i> No audit entries</div>'; return; }
        el.innerHTML = `<table><thead><tr><th>Time</th><th>Action</th><th>IP</th><th>Details</th></tr></thead><tbody>
            ${data.map(a => `<tr>
                <td style="font-size:.72rem;color:var(--text3);white-space:nowrap">${timeAgo(a.timestamp)}</td>
                <td><span class="sec-badge ${a.action.includes('FAIL')||a.action.includes('ERROR')?'off':'on'}">${esc(a.action)}</span></td>
                <td style="font-family:monospace;font-size:.72rem;color:var(--text3)">${esc(a.ip)}</td>
                <td style="font-size:.78rem;color:var(--text2);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(JSON.stringify(a.details))}</td>
            </tr>`).join('')}
        </tbody></table>`;
    } catch(e) { el.innerHTML = '<div class="empty"><i class="fas fa-exclamation-circle"></i> Error</div>'; }
}

// ====== UTIL ======
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

// ====== INIT ======
checkAuth();
</script>
